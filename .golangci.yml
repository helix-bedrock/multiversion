version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    forbidigo:
      # Never panic, anywhere: see AGENT_RULES.md in helix-bedrock/.github.
      forbid:
        - pattern: ^panic$
          msg: never panic; return an error instead
        - pattern: ^log\.Fatal.*$
          msg: never exit the process; return an error instead
        - pattern: ^os\.Exit$
          msg: never exit the process; return an error instead
    gosec:
      excludes:
        - G115 # integer conversions are everywhere in binary formats; review them instead
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - forbidigo
      # Old versions still use packets and fields the latest protocol marks
      # deprecated; converting them is the point of this repo.
      - path: protocols/
        linters: [staticcheck]
        text: "SA1019"
      # Each adapter's Protocol methods implement version.Protocol and are
      # documented there.
      - path: protocols/
        linters: [revive]
        text: 'exported: exported method Protocol.'
      # Data snapshot tools write repo files and run git on purpose.
      - path: tools/
        linters: [gosec]
        text: "G204|G301|G306"

formatters:
  enable:
    - gofmt
    - goimports
